<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Shopify Skins</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <main class="popup">
      <header class="header">
        <h1>Shopify Skins</h1>
      </header>

      <label class="checkbox" for="colourSchemeEnabled">
        <input id="colourSchemeEnabled" type="checkbox" checked />
        Colour scheme
      </label>

      <div class="swatches" id="swatches" aria-hidden="true"></div>

      <div class="colours" id="colourControls">
        <label class="colourRow" for="primaryHex">
          <span class="colourLabel">Primary</span>
          <input id="primaryColour" type="color" value="#B9A3FF" />
          <input
            id="primaryHex"
            class="hex"
            type="text"
            spellcheck="false"
            autocomplete="off"
            maxlength="7"
          />
        </label>

        <label class="colourRow" for="secondaryHex">
          <span class="colourLabel">Secondary</span>
          <input id="secondaryColour" type="color" value="#FFFFFF" />
          <input
            id="secondaryHex"
            class="hex"
            type="text"
            spellcheck="false"
            autocomplete="off"
            maxlength="7"
          />
        </label>

        <label class="colourRow" for="textHex">
          <span class="colourLabel">Text</span>
          <input id="textColour" type="color" value="#FF61DF" />
          <input
            id="textHex"
            class="hex"
            type="text"
            spellcheck="false"
            autocomplete="off"
            maxlength="7"
          />
        </label>

        <label class="colourRow" for="accentHex">
          <span class="colourLabel">Accent</span>
          <input id="accentColour" type="color" value="#94FFB2" />
          <input
            id="accentHex"
            class="hex"
            type="text"
            spellcheck="false"
            autocomplete="off"
            maxlength="7"
          />
        </label>
      </div>

      <label class="checkbox" for="useGradient">
        <input id="useGradient" type="checkbox" />
        Use gradient
      </label>

      <label class="field" for="themeInput">
        Slack paste
        <input
          id="themeInput"
          type="text"
          spellcheck="false"
          autocomplete="off"
          placeholder="#B9A3FF,#FFFFFF,#FF61DF,#94FFB2"
        />
      </label>

      <hr class="divider" />

      <section class="apiSection">
        <h2>API functionalities</h2>

        <label class="field" for="accessToken">
          API key
          <input
            id="accessToken"
            type="password"
            spellcheck="false"
            autocomplete="off"
            placeholder="shpat_…"
          />
        </label>

        <label
          class="checkbox is-api-gated"
          for="themeRenameEnabled"
          id="themeRenameRow"
        >
          <input id="themeRenameEnabled" type="checkbox" disabled />
          Renaming themes
        </label>
      </section>

      <div class="actions">
        <button id="exportButton" type="button" class="secondary">
          Export CSV
        </button>
        <button id="resetButton" type="button" class="ghost">Reset</button>
      </div>
    </main>

    <script src="theme_storage.js"></script>
    <script src="settings.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
