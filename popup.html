<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Shopify Skins</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <main class="popup">
      <header class="header">
        <h1>Shopify Skins</h1>
        <p class="hint">Colours update the admin live.</p>
      </header>

      <div class="swatches" id="swatches" aria-hidden="true"></div>

      <div class="colours">
        <label class="colourRow" for="primaryHex">
          <span class="colourLabel">Primary</span>
          <input id="primaryColour" type="color" value="#B9A3FF" />
          <input
            id="primaryHex"
            class="hex"
            type="text"
            spellcheck="false"
            autocomplete="off"
            maxlength="7"
          />
        </label>

        <label class="colourRow" for="secondaryHex">
          <span class="colourLabel">Secondary</span>
          <input id="secondaryColour" type="color" value="#FFFFFF" />
          <input
            id="secondaryHex"
            class="hex"
            type="text"
            spellcheck="false"
            autocomplete="off"
            maxlength="7"
          />
        </label>

        <label class="colourRow" for="textHex">
          <span class="colourLabel">Text</span>
          <input id="textColour" type="color" value="#FF61DF" />
          <input
            id="textHex"
            class="hex"
            type="text"
            spellcheck="false"
            autocomplete="off"
            maxlength="7"
          />
        </label>

        <label class="colourRow" for="accentHex">
          <span class="colourLabel">Accent</span>
          <input id="accentColour" type="color" value="#94FFB2" />
          <input
            id="accentHex"
            class="hex"
            type="text"
            spellcheck="false"
            autocomplete="off"
            maxlength="7"
          />
        </label>
      </div>

      <label class="checkbox" for="useGradient">
        <input id="useGradient" type="checkbox" />
        Use gradient
      </label>

      <label class="field" for="themeInput">
        Slack paste
        <input
          id="themeInput"
          type="text"
          spellcheck="false"
          autocomplete="off"
          placeholder="#B9A3FF,#FFFFFF,#FF61DF,#94FFB2"
        />
      </label>

      <hr class="divider" />

      <section class="apiSection">
        <h2>Theme rename</h2>
        <p class="hint">
          Double-click a theme name in admin. Powered by mineral
          <code>shopifyThemeUpdate</code>.
        </p>

        <label class="field" for="accessToken">
          Admin API token
          <input
            id="accessToken"
            type="password"
            spellcheck="false"
            autocomplete="off"
            placeholder="shpat_…"
          />
        </label>

        <label class="field" for="mineralUrl">
          Mineral URL
          <input
            id="mineralUrl"
            type="url"
            spellcheck="false"
            autocomplete="off"
            placeholder="http://127.0.0.1:8000"
          />
        </label>
      </section>

      <p id="status" class="status" role="status"></p>

      <div class="actions">
        <button id="exportButton" type="button" class="secondary">
          Export CSV
        </button>
        <button id="resetButton" type="button" class="ghost">Reset</button>
      </div>
    </main>

    <script src="theme.js"></script>
    <script src="settings.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
