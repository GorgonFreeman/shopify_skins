<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Shopify Skins</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <main class="popup">
      <header class="header">
        <h1>Shopify Skins</h1>
      </header>

      <section class="featureSection">
        <h2>No API key needed</h2>

        <article class="featureRow" id="colourSchemeRow">
          <div class="featureHeader">
            <label class="featureToggle" for="colourSchemeEnabled">
              <input id="colourSchemeEnabled" type="checkbox" checked />
              <span>Colour scheme</span>
            </label>
            <button
              id="colourSchemeExpand"
              class="featureExpand"
              type="button"
              aria-expanded="false"
              aria-controls="colourSchemeSettings"
              title="Colour scheme settings"
            >
              <span class="chevron" aria-hidden="true"></span>
            </button>
          </div>

          <div
            id="colourSchemeSettings"
            class="featureSettings"
            hidden
          >
            <div class="swatches" id="swatches" aria-hidden="true"></div>

            <div class="colours" id="colourControls">
              <label class="colourRow" for="primaryHex">
                <span class="colourLabel">Primary</span>
                <input id="primaryColour" type="color" value="#B9A3FF" />
                <input
                  id="primaryHex"
                  class="hex"
                  type="text"
                  spellcheck="false"
                  autocomplete="off"
                  maxlength="7"
                />
              </label>

              <label class="colourRow" for="secondaryHex">
                <span class="colourLabel">Secondary</span>
                <input id="secondaryColour" type="color" value="#FFFFFF" />
                <input
                  id="secondaryHex"
                  class="hex"
                  type="text"
                  spellcheck="false"
                  autocomplete="off"
                  maxlength="7"
                />
              </label>

              <label class="colourRow" for="textHex">
                <span class="colourLabel">Text</span>
                <input id="textColour" type="color" value="#FF61DF" />
                <input
                  id="textHex"
                  class="hex"
                  type="text"
                  spellcheck="false"
                  autocomplete="off"
                  maxlength="7"
                />
              </label>

              <label class="colourRow" for="accentHex">
                <span class="colourLabel">Accent</span>
                <input id="accentColour" type="color" value="#94FFB2" />
                <input
                  id="accentHex"
                  class="hex"
                  type="text"
                  spellcheck="false"
                  autocomplete="off"
                  maxlength="7"
                />
              </label>
            </div>

            <label class="checkbox" for="useGradient">
              <input id="useGradient" type="checkbox" />
              Use gradient
            </label>

            <label class="field" for="themeInput">
              Slack paste
              <input
                id="themeInput"
                type="text"
                spellcheck="false"
                autocomplete="off"
                placeholder="#B9A3FF,#FFFFFF,#FF61DF,#94FFB2"
              />
            </label>

            <div class="actions">
              <button id="exportButton" type="button" class="secondary">
                Export CSV
              </button>
              <button id="resetButton" type="button" class="ghost">Reset</button>
            </div>
          </div>
        </article>

        <article class="featureRow" id="themePreviewRow">
          <div class="featureHeader">
            <label class="featureToggle" for="themePreviewEnabled">
              <input id="themePreviewEnabled" type="checkbox" />
              <span>Preview themes</span>
            </label>
            <button
              id="themePreviewExpand"
              class="featureExpand"
              type="button"
              aria-expanded="false"
              aria-controls="themePreviewSettings"
              title="Preview themes settings"
            >
              <span class="chevron" aria-hidden="true"></span>
            </button>
          </div>

          <div
            id="themePreviewSettings"
            class="featureSettings is-empty"
            hidden
          ></div>
        </article>
      </section>

      <section class="featureSection">
        <h2>Requires API key</h2>

        <label class="field" for="accessToken">
          API key
          <input
            id="accessToken"
            type="password"
            spellcheck="false"
            autocomplete="off"
            placeholder="shpat_…"
          />
        </label>

        <article class="featureRow is-api-gated" id="themeRenameRow">
          <div class="featureHeader">
            <label class="featureToggle" for="themeRenameEnabled">
              <input id="themeRenameEnabled" type="checkbox" disabled />
              <span>Renaming themes</span>
            </label>
            <button
              id="themeRenameExpand"
              class="featureExpand"
              type="button"
              aria-expanded="false"
              aria-controls="themeRenameSettings"
              title="Renaming themes settings"
            >
              <span class="chevron" aria-hidden="true"></span>
            </button>
          </div>

          <div
            id="themeRenameSettings"
            class="featureSettings is-empty"
            hidden
          ></div>
        </article>

        <article class="featureRow is-api-gated" id="storeSwitchRow">
          <div class="featureHeader">
            <label class="featureToggle" for="storeSwitchEnabled">
              <input id="storeSwitchEnabled" type="checkbox" disabled />
              <span>Switch stores</span>
            </label>
            <button
              id="storeSwitchExpand"
              class="featureExpand"
              type="button"
              aria-expanded="false"
              aria-controls="storeSwitchSettings"
              title="Switch stores settings"
            >
              <span class="chevron" aria-hidden="true"></span>
            </button>
          </div>

          <div
            id="storeSwitchSettings"
            class="featureSettings is-empty"
            hidden
          ></div>
        </article>
      </section>
    </main>

    <script src="theme_storage.js"></script>
    <script src="settings.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
